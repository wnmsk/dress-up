name: Fuzz
on:
  push:
  pull_request:
  schedule:
    # Weekly on Sundays at 00:01 UTC
    - cron: "1 0 * * 0"

env:
  CARGO_TERM_COLOR: always
  NIGHTLY_TOOLCHAIN: nightly-2026-06-01

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Fuzz (no structure-awareness)"
            target: "unaware"
          - name: "Fuzz (envelope wrapper)"
            target: "envlp_wrap"
          - name: "Fuzz (manifest builder)"
            target: "manifest_gen"

    name: ${{ matrix.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        run: |
          rustup toolchain install "$NIGHTLY_TOOLCHAIN"
          rustup default "$NIGHTLY_TOOLCHAIN"
          cargo install cargo-fuzz
          rustup component add --toolchain "$NIGHTLY_TOOLCHAIN" llvm-tools-preview
          pip install matplotlib

      - name: Compute timestamp (for naming archives)
        id: ts
        shell: bash
        run: |
          echo "stamp=$(date -u +'%Y%m%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Build fuzz target
        run: cargo fuzz build ${{ matrix.target }}

      - name: Run fuzz tests
        # 1h on push/PR, 24h on weekly schedule
        run: |
          MAX_TIME=3600
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MAX_TIME=86400
          fi
          ./fuzz/scripts/run_tests.sh $MAX_TIME ${{ matrix.target }}

      - name: Archive corpus, artifacts and results directory (metrics and cov reports)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ts.outputs.stamp }}_${{ matrix.target }}-export
          path: |
            fuzz/results/**
